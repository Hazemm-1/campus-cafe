<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Campus Cafe</title>
     <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
    <h1 id="site-title">Campus Cafe</h1>
    <p class="tagline">Fresh coffee for busy students</p>
    <nav>
  <a href="index.html">Home</a>
  <a href="menu.html">Menu</a>
  <a href="contact.html" aria-current="page">Contact</a>
</nav>
  </header>
   
  <main>
    <section id="contact">
      <h2>Contact / Pre-order</h2>
 
    <form action="#" method="post">
     
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>  
    
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
   
        <label for="date">Order Date:</label>
        <input type="date" id="date" name="date" required>
   
        <label for="qty">Number of drinks:</label>
        <input type="number" id="qty" name="qty" min="1" max="10" value="1" required>
        
        <label for="size">Size:</label>
        <select id="size" name="size" required>
          <option value="">Select Size</option>
          <option value="small">Small</option>
          <option value="medium">Medium</option>
          <option value="large">Large</option>
        </select>

        <label for="country">Country:</label>
        <select id="country" name="country" required>
          <option value="">Select Country</option>
          <option value="us">United States</option>
          <option value="uk">United Kingdom</option>
          <option value="eg">Egypt</option>
          <option value="au">Australia</option>
        </select>
   
        <fieldset>
           
             <legend>Extras:</legend>
          <label><input type="checkbox" name="extras" value="sugar"> Extra sugar</label>
          <label><input type="checkbox" name="extras" value="oat-milk"> Oat milk</label>
          <label><input type="checkbox" name="extras" value="shot"> Extra shot</label>
             
        </fieldset>
        
    <label for="msg">Message:</label>   
    <textarea id="msg" name="msg" rows="10" required></textarea>
     
    <button type="submit">Send</button>
  
    </form> 
   </section>
  </main>
  
  <footer>
    <p>&copy; 2026 Campus Cafe |
<a href="https://github.com" target="_blank">Our GitHub</a></p>
 
</footer>
</body>
</html>
